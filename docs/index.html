const scenarios=[{id:'custom',icon:'🎛️',name:'自己设定',desc:'决定球员的场均表现',stats:{pts:25,reb:7,ast:6,stl:1.5,blk:1}},{id:'scorer',icon:'🔥',name:'得分机器',desc:'如果他场均拿下 40 分',stats:{pts:40,reb:7,ast:5,stl:1,blk:1}},{id:'five',icon:'🌟',name:'完美五双',desc:'五项数据全部达到两位数',stats:{pts:20,reb:10,ast:10,stl:10,blk:10}},{id:'defender',icon:'🛡️',name:'防守怪物',desc:'每场 8 抢断、6 盖帽',stats:{pts:18,reb:10,ast:5,stl:8,blk:6}},{id:'triple',icon:'📊',name:'场均三双',desc:'得分、篮板、助攻都上双',stats:{pts:24,reb:11,ast:11,stl:1.5,blk:1}}];
const statMeta=[['pts','得分'],['reb','篮板'],['ast','助攻'],['stl','抢断'],['blk','盖帽']],eventDeck=[{title:'训练场上的加练',body:'教练注意到了你的投入，愿意给你更多战术发言权。',good:'接受加练',effect:{morale:5,overall:1},bad:'保持节奏',effect2:{health:3}},{title:'媒体把你推上风口浪尖',body:'一场爆发后，媒体开始讨论你是不是联盟下一位门面。',good:'享受聚光灯',effect:{morale:7,fame:2},bad:'专注比赛',effect2:{morale:2}},{title:'队友希望你多传球',body:'更衣室觉得球队可以打得更流畅。',good:'分享球权',effect:{team:2,morale:3},bad:'继续相信手感',effect2:{morale:-2}},{title:'小伤需要休息',body:'队医建议本周降低出场时间，避免伤势扩大。',good:'听从队医',effect:{health:8},bad:'坚持出战',effect2:{health:-8}},{title:'老将邀请你一起训练',body:'一次训练课，或许能让你在关键时刻更沉稳。',good:'跟他练练',effect:{clutch:2,overall:1},bad:'自己安排训练',effect2:{overall:1}}];
let chosenScenario=scenarios[0],chosenPlayer=null,career=null;
const $=s=>document.querySelector(s),home=$('#home'),careerView=$('#career'),savesView=$('#saves');
teams.forEach(([id,name])=>$('#teamFilter').insertAdjacentHTML('beforeend',`<option value="${id}">${esc(name)}</option>`));
scenarios.forEach((s,i)=>$('#scenarios').insertAdjacentHTML('beforeend',`<button class="card scenario ${i===0?'selected':''}" data-id="${s.id}"><span class="icon">${s.icon}</span><strong>${s.name}</strong><small>${s.desc}</small></button>`));
statMeta.forEach(([k,n])=>$('#statInputs').insertAdjacentHTML('beforeend',`<div><label for="stat-${k}">${n} / 场</label><input id="stat-${k}" type="number" min="0" max="99" step="0.1" value="${chosenScenario.stats[k]}"></div>`));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPlayers(){const q=$('#search').value.trim().toLowerCase(),team=$('#teamFilter').value;let list=players.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!team||String(p.team)===team));list.sort((a,b)=>(b.active-a.active)||(b.overall-a.overall)||a.name.localeCompare(b.name));$('#players').innerHTML=list.slice(0,60).map(p=>`<button class="player ${chosenPlayer?.id===p.id?'selected':''}" data-id="${p.id}"><span><strong>${esc(p.name)}</strong><small>${esc(p.teamName||'自由球员')} · ${esc(p.pos||'位置未知')}</small></span><span class="rating">${p.overall||'—'}</span></button>`).join('')||'<div class="empty">没找到这位球员。试试英文名或其他拼法。</div>';$('.player', $('#players'))?.setAttribute('aria-label','选择球员')}
function updateStats(){statMeta.forEach(([k])=>$('#stat-'+k).value=chosenScenario.stats[k])}
$('#scenarios').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;chosenScenario=scenarios.find(s=>s.id===b.dataset.id);$('#scenarios').querySelectorAll('.scenario').forEach(x=>x.classList.toggle('selected',x===b));updateStats()});
$('#players').addEventListener('click',e=>{const b=e.target.closest('.player');if(!b)return;chosenPlayer=players.find(p=>p.id===Number(b.dataset.id));renderPlayers();$('#startBtn').disabled=!chosenPlayer});$('#search').addEventListener('input',renderPlayers);$('#teamFilter').addEventListener('change',renderPlayers);renderPlayers();
function readStats(){return Object.fromEntries(statMeta.map(([k])=>[k,Math.max(0,Math.min(99,Number($('#stat-'+k).value)||0))]))}
function saveAll(){localStorage.setItem('nba-career-saves-v1',JSON.stringify(getSaves()))}function getSaves(){try{return JSON.parse(localStorage.getItem('nba-career-saves-v1')||'[]')}catch{return []}}
function show(which){[home,careerView,savesView].forEach(x=>x.hidden=x!==which);window.scrollTo({top:0,behavior:'smooth'})}
function createCareer(){const c={id:crypto.randomUUID?.()||String(Date.now()),player:chosenPlayer,scenario:chosenScenario.name,stats:readStats(),week:0,wins:0,events:[],history:[],attrs:{morale:75,health:100,overall:chosenPlayer.overall||65,clutch:50,fame:0},pendingEvent:null,started:Date.now(),done:false};career=c;getSaves().unshift(c);saveAll();show(careerView);renderCareer()}
$('#startBtn').addEventListener('click',createCareer);
function avg(k){return career.stats[k]}
function renderScore(){const vals=[['场均得分','pts'],['篮板','reb'],['助攻','ast'],['抢断','stl'],['盖帽','blk']];return `<div class="score">${vals.map(([n,k])=>`<div class="card"><strong>${avg(k).toFixed(1)}</strong><span>${n}</span></div>`).join('')}</div>`}
function renderCareer(){if(!career)return;const pct=Math.round(career.week/30*100),p=career.player;careerView.innerHTML=`<div class="card banner"><div><div class="eyebrow">${career.done?'赛季总结':'2025—26 常规赛'}</div><h2>${esc(p.name)} · ${esc(career.scenario)}</h2><div class="muted small">${esc(p.teamName||'自由球员')} · ${esc(p.pos||'NBA 球员')} · 综合评分 ${career.attrs.overall}</div></div><button class="quiet" id="homeBtn">退出生涯</button></div>${career.done?summaryHtml():`<div class="progress"><i style="width:${pct}%"></i></div><div class="save-row"><strong>第 ${career.week} / 30 周</strong><span class="muted">${career.wins} 胜 · ${career.history.reduce((n,x)=>n+x.games,0)-career.wins} 负</span><button class="quiet right" id="saveBtn">导出存档</button></div>${renderScore()}<div class="card"><strong>本周比赛</strong><p class="muted small">你的设定数据将按真实赛季长度推进。每周可能出现事件，决定会影响状态和球队表现。</p><button class="btn primary" id="advance" ${career.pendingEvent?'disabled':''}>${career.pendingEvent?'先处理本周事件':career.week===29?'结束常规赛':'推进下一周'} →</button></div>${career.pendingEvent?pendingEventHtml():''}<div class="feed">${career.events.slice(-5).reverse().map(eventHtml).join('')}</div>`}`;
$('#homeBtn').onclick=()=>{career=null;show(home)};if(!career.done){$('#advance').onclick=advanceWeek;$('#saveBtn').onclick=exportCurrent}}
function pendingEventHtml(){const e=career.pendingEvent;return `<article class="card event"><div class="eyebrow">本周事件 · 请选择</div><h3>${esc(e.title)}</h3><p>${esc(e.body)}</p><button class="btn primary" data-choice="good">${esc(e.good)}</button><button class="btn" data-choice="bad">${esc(e.bad)}</button></article>`}
function eventHtml(e){return `<article class="card event"><h3>${esc(e.title)}</h3><p>${esc(e.body)}</p>${e.choice?`<p class="small" style="color:var(--green)">你的选择：${esc(e.choice)}</p>`:''}</article>`}
function advanceWeek(){if(career.week>=30)return;career.week++;const s=career.stats,variance=()=>.85+Math.random()*.3;const performance=(s.pts*1.7+s.reb*.55+s.ast*.65+s.stl*1.25+s.blk*1.2),chance=Math.max(.08,Math.min(.92,.5+(performance-65)/450+(career.attrs.overall-70)/350));const games=career.week%4===0||career.week===30?2:3;let w=0;for(let i=0;i<games;i++)if(Math.random()<chance)w++;career.wins+=w;career.history.push({week:career.week,wins:w,games,pts:(s.pts*variance()).toFixed(1)});
if(career.week<30&&Math.random()<.46){const ev=eventDeck[Math.floor(Math.random()*eventDeck.length)];career.pendingEvent=ev;}
if(career.week===30){career.done=true;career.wins=Math.min(career.wins,82);const arr=getSaves(),at=arr.findIndex(x=>x.id===career.id);if(at>=0)arr[at]=career;localStorage.setItem('nba-career-saves-v1',JSON.stringify(arr));}else saveAll();renderCareer();window.scrollTo({top:0,behavior:'smooth'})}
function summaryHtml(){const r=career.wins,stats=career.stats;let rank=r>=60?'争冠热门':r>=45?'季后赛球队':r>=30?'重建中的竞争者':'艰难的一季';let award=stats.pts>=35?'得分王级表现':stats.ast>=13?'助攻王级表现':stats.reb>=16?'篮板王级表现':stats.stl>=5?'抢断纪录级表现':stats.blk>=5?'盖帽纪录级表现':'稳定的明星赛季';return `<div class="card" style="margin-top:14px"><div class="eyebrow">常规赛结束</div><h2 style="font-size:32px;margin:4px 0">${r} 胜 · ${82-r} 负</h2><p class="muted">${rank} · ${award}</p>${renderScore()}<div class="notice">这是浏览器版的快速模拟结果，表现和比赛结果带有随机波动。您的完整存档保存在本机浏览器。</div><div class="controls" style="margin-top:16px"><button class="btn primary" id="shareBtn">复制赛季战报</button><button class="btn" id="exportBtn">导出存档文件</button><button class="btn" id="newBtn">再开一段生涯</button></div></div><div class="card" style="margin-top:12px"><strong>赛季走势</strong><div class="table-wrap"><table class="table"><thead><tr><th>周</th><th>战绩</th><th>球员得分</th></tr></thead><tbody>${career.history.map(x=>`<tr><td>第 ${x.week} 周</td><td>${x.wins} 胜 ${x.games-x.wins} 负</td><td>${x.pts}</td></tr>`).join('')}</tbody></table></div></div><div class="feed">${career.events.slice().reverse().map(eventHtml).join('')}</div>`}
careerView.addEventListener('click',async e=>{if(e.target.matches('[data-choice]')){const good=e.target.dataset.choice==='good',ev=career.pendingEvent,eff=good?ev.effect:ev.effect2;career.attrs.morale=Math.max(0,Math.min(100,career.attrs.morale+(eff.morale||0)));career.attrs.health=Math.max(0,Math.min(100,career.attrs.health+(eff.health||0)));career.attrs.overall=Math.max(1,Math.min(99,career.attrs.overall+(eff.overall||0)));career.attrs.fame=Math.max(0,career.attrs.fame+(eff.fame||0));career.attrs.clutch+=eff.clutch||0;career.events.push({title:ev.title,body:ev.body,choice:good?ev.good:ev.bad});career.pendingEvent=null;saveAll();renderCareer();return}if(e.target.id==='shareBtn'){const c=career,text=`🏀 NBA 假如模拟器\n${c.player.name}：${c.stats.pts}分 / ${c.stats.reb}篮板 / ${c.stats.ast}助攻 / ${c.stats.stl}抢断 / ${c.stats.blk}盖帽\n球队战绩：${c.wins}胜${82-c.wins}负 · ${c.scenario}`;await navigator.clipboard?.writeText(text);toast('赛季战报已复制，可以发给朋友');}if(e.target.id==='exportBtn')exportCurrent();if(e.target.id==='newBtn'){career=null;chosenPlayer=null;$('#startBtn').disabled=true;show(home)}});
function exportCurrent(){download(JSON.stringify(career,null,2),`nba-career-${career.player.name.replace(/[^\w\u4e00-\u9fa5-]/g,'-')}.json`,'application/json')}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2300)}
function renderSaves(){const list=getSaves();savesView.innerHTML=`<div class="card"><div class="save-row"><div><div class="eyebrow">LOCAL SAVES</div><h2 style="margin:2px 0">我的生涯</h2></div><button class="quiet" id="backHome">返回首页</button></div>${list.length?`<div class="feed">${list.map(c=>`<div class="card save-row"><div><strong>${esc(c.player.name)}</strong><div class="small muted">${esc(c.scenario)} · 第 ${c.week}/30 周 ${c.done?'· 已结束':''}</div></div><div class="controls"><button class="quiet loadSave" data-id="${esc(c.id)}">${c.done?'查看':'继续'}</button><button class="quiet deleteSave" data-id="${esc(c.id)}">删除</button></div></div>`).join('')}</div><div class="controls" style="margin-top:14px"><button class="btn" id="importBtn">导入存档文件</button><button class="btn" id="backupBtn">备份全部存档</button><input hidden type="file" id="fileInput" accept="application/json"></div>`:'<div class="empty">还没有生涯记录。选一位球员，开始第一段假如生涯吧。</div>'}</div>`;$('#backHome').onclick=()=>show(home);savesView.querySelectorAll('.loadSave').forEach(b=>b.onclick=()=>{career=getSaves().find(x=>x.id===b.dataset.id);show(careerView);renderCareer()});savesView.querySelectorAll('.deleteSave').forEach(b=>b.onclick=()=>{localStorage.setItem('nba-career-saves-v1',JSON.stringify(getSaves().filter(x=>x.id!==b.dataset.id)));renderSaves()});if(list.length){$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());const batch=Array.isArray(obj)?obj:[obj];localStorage.setItem('nba-career-saves-v1',JSON.stringify([...batch,...getSaves()]));toast('存档已导入');renderSaves()}catch{toast('这个存档文件无法读取')}};$('#backupBtn').onclick=()=>download(JSON.stringify(list,null,2),'nba-career-saves.json','application/json')}}
$('#savesBtn').onclick=()=>{renderSaves();show(savesView)};
$('#downloadBtn').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#home').hidden=false;clone.querySelector('#career').hidden=true;clone.querySelector('#saves').hidden=true;const html='<!doctype html>\n'+clone.outerHTML;download(html,'NBA-假如模拟器-离线版.html','text/html;charset=utf-8')};
})();
</script></body></html>
